services:
  dtc-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: dtc-dashboard:latest
    container_name: dtc-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8089
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8080/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
